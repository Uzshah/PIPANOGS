name: CPU checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install pytest==9.1.1 numpy==1.26.4 Pillow==11.2.1 opencv-python-headless==4.11.0.86
      - run: python -m pytest -q
      - run: python tools/verify_release.py
